name: "sast-scan"

on:
  push:
    branches: [githubcicd]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: |
          npm ci --force

      - name: OWASP Dependency Check
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v7.2.0/dependency-check-7.2.0-release.zip
          unzip dependency-check-7.2.0-release.zip

      - name: Run scan with ODC
        run: |
            mkdir -p odc-report
            dependency-check/bin/dependency-check.sh \
              --project "bitcoin" \
              --scan ./ \
              --format HTML \
              --out odc-report \
              --disableAssembly
            zip -r sast-report.zip odc-report

      - name: Check report exists
        run: ls -lh odc-report
          
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
            name: sast report
            path: sast-report.zip
